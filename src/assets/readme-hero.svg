        <text x="795" y="204" fill="#17221B" font-size="24" font-weight="700" letter-spacing="-.8">Build. Learn.</text>
        <text x="795" y="230" fill="#17221B" font-size="24" font-weight="700" letter-spacing="-.8">Understand.</text>
        <rect x="795" y="246" width="45" height="4" fill="#A3CD45"/>
        <text x="795" y="271" fill="#667064" font-size="9.5">Thoughtful interfaces, practical systems,</text>
        <text x="795" y="285" fill="#667064" font-size="9.5">and room to keep getting better.</text>

