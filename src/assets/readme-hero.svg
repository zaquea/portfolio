    <text x="60" y="249" fill="#17221B" font-size="63" font-weight="700" letter-spacing="-2.8">put to work.</text>
    <rect x="62" y="272" width="53" height="5" fill="#A3CD45"/>
    <text x="62" y="315" fill="#48534A" font-size="17">A home for the interfaces I build,</text>
